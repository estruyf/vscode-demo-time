name: Publish MCP Package

# Only publishes when the commit message contains #mcp, or when run by hand.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  MCP_PATH: ./apps/mcp

# Trusted publishing: npm checks the GitHub OIDC token of this workflow instead of an npm token.
# The package's settings on npmjs.com name this repository and publish-mcp.yml as its publisher.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '#mcp')
    defaults:
      run:
        working-directory: ${{ env.MCP_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      # Trusted publishing needs npm 11.5.1 or later. Pinned, so every publish runs the same npm.
      - name: Update npm
        run: npm install -g npm@11.21.0

      - name: Install dependencies
        run: npm i

      - name: Update package version with build number as patch
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          PATCH_VERSION=$((39 + BUILD_NUMBER))
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. -v p=$PATCH_VERSION '{print $1"."$2"."p}')
          npm version $NEW_VERSION --no-git-tag-version --allow-same-version

      - name: Build package
        run: npm run build

      - name: Build search
        run: npm run search:build

      # No token: npm authenticates with the workflow's OIDC token and adds provenance
      - name: Publish to npm
        run: npm publish --access public
